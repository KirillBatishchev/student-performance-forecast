apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-performance-ui
  labels:
    app: student-performance-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-performance-ui
  template:
    metadata:
      labels:
        app: student-performance-ui
    spec:
      containers:
        - name: ui
          image: ghcr.io/kirillbatishchev/student-performance-forecast-ui:52f188ad119c2313ae03a2f6e62988c758f623c3
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: "http://student-performance-forecast-service"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 5