name: Docker-deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  Build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Copy code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Dockerfile
        run: docker build -t student-performance-forecast:test .

  Deploy:
    name: Push to registry
    runs-on: ubuntu-latest
    needs: Build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Copy code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ghcr.io/kirillbatishchev/student-performance-forecast:latest
            ghcr.io/kirillbatishchev/student-performance-forecast:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/kirillbatishchev/student-performance-forecast:buildcache
          cache-to: type=registry,ref=ghcr.io/kirillbatishchev/student-performance-forecast:buildcache,mode=max

      - name: Build and push UI
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ui
          push: true
          tags: |
            ghcr.io/kirillbatishchev/student-performance-forecast-ui:latest
            ghcr.io/kirillbatishchev/student-performance-forecast-ui:${{ github.sha }}

      - name: Update k8s manifest
        run: |
          sed -i \
          "s|image: ghcr.io/kirillbatishchev/student-performance-forecast:.*|image: ghcr.io/kirillbatishchev/student-performance-forecast:${{ github.sha }}|" \
          k8s/deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --staged --quiet || git commit -m "chore: update image tag to ${{ github.sha }}"
          git push